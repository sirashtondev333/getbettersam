<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Message Moderation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:       #2B2B26;
      --paper:     #F7F6F2;
      --moss:      #4F6F52;
      --moss-dark: #3C5740;
      --rule:      #DEDACE;
      --muted:     #8A8678;
      --danger:    #A1473A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      padding: 40px 20px;
    }

    /* Password screen */
    #loginScreen {
      max-width: 360px;
      margin: 80px auto;
      text-align: center;
    }

    #loginScreen h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      margin-bottom: 24px;
    }

    #loginScreen input {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 1rem;
      border: 1px solid var(--rule);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    #loginScreen input:focus-visible {
      outline: 2px solid var(--moss);
    }

    #loginScreen button {
      width: 100%;
      padding: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      background: var(--moss);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #loginScreen button:hover { background: var(--moss-dark); }

    #loginError {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* Admin panel */
    #adminPanel { display: none; max-width: 680px; margin: 0 auto; }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
    }

    .admin-header h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
    }

    #pendingCount {
      font-size: 0.85rem;
      color: var(--muted);
    }

    #logoutBtn {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
    }

    #logoutBtn:hover { color: var(--ink); border-color: var(--ink); }

    .message-card {
      background: white;
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
      animation: fade-in 0.3s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-card__meta {
      display: flex;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .message-card__name {
      font-family: 'Fraunces', serif;
      font-weight: 600;
    }

    .message-card__time {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .message-card__text {
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .message-card__actions {
      display: flex;
      gap: 10px;
    }

    .btn-approve, .btn-reject {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 7px 18px;
      cursor: pointer;
    }

    .btn-approve {
      background: var(--moss);
      color: white;
    }

    .btn-approve:hover { background: var(--moss-dark); }

    .btn-reject {
      background: #f5e8e7;
      color: var(--danger);
    }

    .btn-reject:hover { background: #edcfcc; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 60px 0;
      font-size: 0.95rem;
    }

    .empty-state span { font-size: 2rem; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- Password screen -->
  <div id="loginScreen">
    <h2>Admin Login</h2>
    <input type="password" id="passwordInput" placeholder="Enter admin password">
    <button id="loginBtn">Log in</button>
    <p id="loginError">Incorrect password. Try again.</p>
  </div>

  <!-- Admin panel (hidden until logged in) -->
  <div id="adminPanel">
    <div class="admin-header">
      <div>
        <h2>Message Moderation</h2>
        <p id="pendingCount">Loading…</p>
      </div>
      <button id="logoutBtn">Log out</button>
    </div>
    <div id="messageList"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, query,
    orderBy, where, updateDoc, deleteDoc, doc
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  // ---- CHANGE THIS to your chosen admin password ----
  const ADMIN_PASSWORD = "changeme123";
  // ---------------------------------------------------

  const firebaseConfig = {
    apiKey: "AIzaSyCyZ1p7KqQFdHR5-rQ8Nips086gH-VQiok",
    authDomain: "getbettersam-6eb58.firebaseapp.com",
    projectId: "getbettersam-6eb58",
    storageBucket: "getbettersam-6eb58.firebasestorage.app",
    messagingSenderId: "307265841116",
    appId: "1:307265841116:web:72795da7cfc4eaf0ed9119"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const wishesRef = collection(db, "wellWishes");

  // ---- Login ----
  const loginScreen = document.getElementById("loginScreen");
  const adminPanel = document.getElementById("adminPanel");
  const passwordInput = document.getElementById("passwordInput");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const logoutBtn = document.getElementById("logoutBtn");
  const messageList = document.getElementById("messageList");
  const pendingCount = document.getElementById("pendingCount");

  function login() {
    if (passwordInput.value === ADMIN_PASSWORD) {
      loginScreen.style.display = "none";
      adminPanel.style.display = "block";
      loadMessages();
    } else {
      loginError.style.display = "block";
      passwordInput.value = "";
      passwordInput.focus();
    }
  }

  loginBtn.addEventListener("click", login);
  passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") login(); });

  logoutBtn.addEventListener("click", () => {
    adminPanel.style.display = "none";
    loginScreen.style.display = "block";
    passwordInput.value = "";
  });

  // ---- Load pending messages ----
  function loadMessages() {
    const pendingQuery = query(
      wishesRef,
      where("status", "==", "pending"),
      orderBy("createdAt", "asc")
    );

    onSnapshot(pendingQuery, (snapshot) => {
      const count = snapshot.docs.length;
      pendingCount.textContent = count === 0
        ? "No messages waiting"
        : `${count} message${count === 1 ? "" : "s"} waiting for review`;

      if (count === 0) {
        messageList.innerHTML = `
          <div class="empty-state">
            <span>✅</span>
            All caught up! No pending messages right now.
          </div>`;
        return;
      }

      messageList.innerHTML = snapshot.docs.map(d => {
        const w = d.data();
        return `
          <div class="message-card" data-id="${d.id}">
            <div class="message-card__meta">
              <span class="message-card__name">${escapeHtml(w.name)}</span>
              <span class="message-card__time">${formatTime(w.createdAt)}</span>
            </div>
            <p class="message-card__text">${escapeHtml(w.comment)}</p>
            <div class="message-card__actions">
              <button class="btn-approve" data-id="${d.id}">✓ Approve</button>
              <button class="btn-reject"  data-id="${d.id}">✕ Delete</button>
            </div>
          </div>`;
      }).join("");

      // Approve
      messageList.querySelectorAll(".btn-approve").forEach(btn => {
        btn.addEventListener("click", async () => {
          await updateDoc(doc(db, "wellWishes", btn.dataset.id), { status: "approved" });
        });
      });

      // Reject (delete entirely)
      messageList.querySelectorAll(".btn-reject").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (confirm("Delete this message permanently?")) {
            await deleteDoc(doc(db, "wellWishes", btn.dataset.id));
          }
        });
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(timestamp) {
    if (!timestamp) return "just now";
    return timestamp.toDate().toLocaleDateString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
</script>

</body>
</html>
